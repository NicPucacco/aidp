  owner: group:platform
  system: fernhill-platform
  definition: |
    # The WebService API: a long-running HTTP service on the paved road.
    #
    # Named WebService, not Service (collides with core Service/svc) or App
    # (collides with Argo CD's app/apps short names). See ADR-0008.
    apiVersion: apiextensions.crossplane.io/v2
    kind: CompositeResourceDefinition
    metadata:
      name: webservices.platform.fernhill.io
      annotations:
        # An API is never removed as a side effect of a sync or of deleting the
        # Argo CD app: Crossplane stops reconciling XRs once their XRD goes, which
        # strands every instance (and, for Database, its data). Removal is a
        # deliberate step once no instances remain. See ADR-0010.
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      scope: Namespaced
      group: platform.fernhill.io
      names:
        kind: WebService
        plural: webservices
        categories: [fernhill]
      defaultCompositionRef:
        name: webservice-kubernetes
      versions:
        - name: v1alpha1
          served: true
          referenceable: true
          additionalPrinterColumns:
            - name: Image
              type: string
