# `:latest` (or no tag) means what runs depends on when the pod was
# scheduled. Rollbacks and audits both need an exact version.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pinned-images
  annotations:
    policies.kyverno.io/title: Require pinned image tags
    policies.kyverno.io/category: Fernhill baseline
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.fernhill.io/managed: "true"
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
  variables:
    - name: containers
      expression: >-
        object.spec.template.spec.containers +
        object.spec.template.spec.?initContainers.orValue([])
  validations:
    # A tag is a ':' after the last '/'; a digest is '@sha256:...'.
    # "registry:5000/app" has a port, not a tag, and is rejected.
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^.+(:[^/:@]+|@sha256:[a-f0-9]{64})$') &&
          !c.image.endsWith(':latest'))
      message: Images must be pinned to a tag or digest, and the tag must not be 'latest'.
