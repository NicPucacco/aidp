apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  parentRefs:
    - name: platform
      namespace: gateway
  hostnames:
    - backstage.localhost
  rules:
    - backendRefs:
        - name: backstage
          port: 80
