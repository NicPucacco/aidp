apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    platform.fernhill.io/owner: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        platform.fernhill.io/owner: platform
    spec:
      serviceAccountName: backstage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: APP_BASE_URL
              value: {{ .Values.baseUrl | quote }}
            # From the Database API's connection secret (ADR-0006).
            {{- range $var, $key := dict "PGHOST" "host" "PGPORT" "port" "PGUSER" "user" "PGPASSWORD" "password" "PGDATABASE" "dbname" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: backstage-app
                  key: {{ $key }}
            {{- end }}
            # Optional: with a token, templates open real PRs. Created out of
            # band (`make portal-token`), never committed.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-github
                  key: token
                  optional: true
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /.backstage/health/v1/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /.backstage/health/v1/liveness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: repo, mountPath: /repo, readOnly: true}
            - {name: tmp, mountPath: /tmp}

        # Keeps /repo/aidp at the revision Argo CD tracks, so the catalog and
        # golden paths reflect Git without a GitHub token (ADR-0011).
        - name: git-sync
          image: {{ .Values.gitSync.image }}
          args:
            - --repo={{ .Values.repoURL }}
            - --ref={{ .Values.targetRevision }}
            - --root=/repo/.git-sync
            - --link=/repo/aidp
            - --period={{ .Values.gitSync.period }}
            - --http-bind=:2020
          ports:
            - name: git-sync
              containerPort: 2020
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: git-sync}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: repo, mountPath: /repo}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: repo, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
