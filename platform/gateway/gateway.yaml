# The platform's single shared ingress point (Gateway API, ADR-0004).
#
# The Envoy data plane is exposed as ClusterIP so this works on any cluster
# without assuming a LoadBalancer implementation; `make gateway` port-forwards
# it locally. On a cloud cluster you'd change envoyService.type to
# LoadBalancer here and nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # *.localhost resolves to 127.0.0.1 in browsers and curl, so no
      # /etc/hosts edits are needed locally.
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          from: All
