{{- $env := .Values.environment }}
# Routes for platform UIs. Tenant routes come from the WebService API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      {{- if $env.tls.enabled }}
      sectionName: https
      {{- end }}
  hostnames:
    - {{ printf "argocd.%s" $env.baseDomain | quote }}
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
