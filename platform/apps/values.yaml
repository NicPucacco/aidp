# Set by the root Application (terraform/argocd) so every child app tracks
# the same repo and revision as the root.
repoURL: https://github.com/NicPucacco/aidp.git
targetRevision: main

# Pinned upstream chart versions. Upgrading a platform component is a PR that
# changes one line here.
versions:
  argocd: 10.9.6
  crossplane: 2.4.2
  kyverno: 3.9.1
  envoyGateway: 1.9.2
  cloudnativePg: 0.29.1
  certManager: v1.21.2
  providerAzure: v2.8.0

# Everything that differs between clusters (ADR-0004, ADR-0017). Defaults are
# the local kind cluster. On AKS, terraform/aks outputs this whole object and
# terraform/argocd passes it through, so no environment-specific values are
# committed to Git.
environment:
  name: local
  # Hostnames are <name>.<baseDomain>; tenant services are
  # <service>-<team>.<baseDomain> (single label, so one wildcard cert covers them).
  baseDomain: localhost
  # Appended to URLs shown to people (status, portal). Locally the Gateway is
  # reached through `make gateway` on :8000.
  urlPort: ":8000"
  gateway:
    serviceType: ClusterIP
    # AKS only: the static public IP Terraform created, and its resource group.
    ipv4: ""
    resourceGroup: ""
  tls:
    enabled: false
    acmeEmail: ""
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt DNS-01 through Azure DNS, authenticated by workload identity.
    azureDNS:
      subscriptionID: ""
      resourceGroup: ""
      zone: ""
      clientID: ""
  # Sign-in with Microsoft Entra ID (ADR-0018). No client secrets: Argo CD
  # and the portal's oauth2-proxy authenticate to Entra with workload
  # identity. Off locally (Argo CD admin, Backstage guest).
  sso:
    enabled: false
    tenantID: ""
    argocdClientID: ""
    portalClientID: ""
    # Entra group object IDs: admins get Argo CD admin; engineers read-only
    # Argo CD and the portal. Nobody else gets in.
    adminsGroupID: ""
    engineersGroupID: ""
  # Where Databases run and what they look like (ADR-0019). Teams only choose a
  # database name; everything here is the platform's decision per environment.
  database:
    backend: cloudnative-pg   # or azure-flexible-server
    cloudnativePG:
      image: ghcr.io/cloudnative-pg/postgresql:18.6
      instances: 1
      storage: 1Gi
      cpu: 100m
      memory: 256Mi
      memoryLimit: 512Mi
    # AKS only (from terraform/aks). Backups: 7 days of point-in-time restore,
    # the minimum Azure allows.
    azure:
      resourceGroup: ""
      location: ""
      version: "17"
      skuName: B_Standard_B1ms
      storageMb: 32768
      backupRetentionDays: 7
      delegatedSubnetID: ""
      privateDNSZoneID: ""
      # Workload identity the Crossplane Azure provider runs as.
      clientID: ""
      tenantID: ""
      subscriptionID: ""
