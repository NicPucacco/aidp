# Platform policies. Wave 1: waits for Kyverno (wave 0) to be healthy so the
# policy CRDs exist. The same files are tested in CI with `kyverno test`
# (ADR-0005).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    # Top-level files only; tests/ holds CI fixtures and is never synced.
    path: platform/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
