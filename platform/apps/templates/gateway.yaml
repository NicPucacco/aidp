# The platform's shared Gateway, TLS, and UI routes. Wave 1: needs the Gateway
# API CRDs (Envoy Gateway) and, with TLS, cert-manager's CRDs (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/gateway
    helm:
      valuesObject:
        environment:
          {{- toYaml .Values.environment | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
