# Composes a Fernhill WebService into a Deployment, Service, optional PDB and
# optional HTTPRoute (ADR-0008, ADR-0014). Everything a team would otherwise
# have to remember (probes, limits, non-root, disruption budget, spreading)
# is decided here once. Tested by rendering real XRs: platform/apis/tests/.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webservice-kubernetes
spec:
  compositeTypeRef:
    apiVersion: platform.fernhill.io/v1alpha1
    kind: WebService
  mode: Pipeline
  pipeline:
    # Loads EnvironmentConfig "platform" (platform/apps/templates/environment.yaml)
    # into the pipeline context: base domain, URL scheme and port per cluster.
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform
    - step: compose
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $team := $xr.metadata.namespace }}
            {{- $spec := $xr.spec | default dict }}
            {{- $port := $spec.port | default 8080 }}
            {{- $replicas := $spec.replicas | default 2 }}
            {{- $healthPath := $spec.healthPath | default "/healthz" }}
            {{- $observed := .observed.resources | default dict }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" }}
            {{- /*
              Single-label hostname (<service>-<team>.<baseDomain>) so one
              wildcard certificate covers every tenant (ADR-0017).
            */}}
            {{- $host := printf "%s-%s.%s" $name $team $env.baseDomain }}

            {{- $sizes := dict
                  "small"  (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "memory" "256Mi"))
                  "medium" (dict "requests" (dict "cpu" "250m" "memory" "512Mi") "limits" (dict "memory" "512Mi"))
                  "large"  (dict "requests" (dict "cpu" "1"    "memory" "2Gi")   "limits" (dict "memory" "2Gi")) }}

            {{- /*
              A fixed non-root UID: images that declare a named USER can't be
              verified as non-root by the kubelet, so the platform pins one.
            */}}
            {{- $runAs := 10001 }}

            {{- /* The Database API's contract: CloudNativePG keys in "<database>-app". */}}
            {{- $pgEnv := list
                  (list "DATABASE_URL" "uri")
                  (list "PGHOST" "host")
                  (list "PGPORT" "port")
                  (list "PGDATABASE" "dbname")
                  (list "PGUSER" "user")
                  (list "PGPASSWORD" "password") }}
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              annotations:
                {{ setResourceNameAnnotation "deployment" }}
                {{- if eq (getResourceCondition "Available" (index $observed "deployment")).Status "True" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels: &labels
                app.kubernetes.io/name: {{ $name }}
                # Team namespaces are named after the team (ADR-0007).
                platform.fernhill.io/owner: {{ $team }}
            spec:
              replicas: {{ $replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              template:
                metadata:
                  labels: *labels
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: {{ $runAs }}
                    runAsGroup: {{ $runAs }}
                    fsGroup: {{ $runAs }}
                    seccompProfile:
                      type: RuntimeDefault
                  {{- if gt (int $replicas) 1 }}
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      # Prefer spreading; don't block scheduling on a 1-node cluster.
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: {{ $name }}
                  {{- end }}
                  containers:
                    - name: app
                      image: {{ $spec.image }}
                      ports:
                        - name: http
                          containerPort: {{ $port }}
                      env:
                        {{- range $spec.env }}
                        - name: {{ .name }}
                          value: {{ .value | quote }}
                        {{- end }}
                        {{- with $spec.database }}
                        {{- $secret := printf "%s-app" . }}
                        {{- range $pgEnv }}
                        # By reference only: credentials never appear in the spec.
                        - name: {{ index . 0 }}
                          valueFrom:
                            secretKeyRef:
                              name: {{ $secret }}
                              key: {{ index . 1 }}
                        {{- end }}
                        {{- end }}
                      resources:
                        {{- index $sizes ($spec.size | default "small") | toYaml | nindent 24 }}
                      readinessProbe:
                        httpGet: {path: {{ $healthPath }}, port: http}
                        periodSeconds: 5
                      livenessProbe:
                        httpGet: {path: {{ $healthPath }}, port: http}
                        periodSeconds: 10
                        failureThreshold: 6
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                  volumes:
                    - name: tmp
                      emptyDir: {}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              annotations:
                {{ setResourceNameAnnotation "service" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/name: {{ $name }}
                platform.fernhill.io/owner: {{ $team }}
            spec:
              selector:
                app.kubernetes.io/name: {{ $name }}
              ports:
                - name: http
                  port: 80
                  targetPort: http
            {{- if gt (int $replicas) 1 }}
            ---
            apiVersion: policy/v1
            kind: PodDisruptionBudget
            metadata:
              name: {{ $name }}
              annotations:
                {{ setResourceNameAnnotation "pdb" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/name: {{ $name }}
                platform.fernhill.io/owner: {{ $team }}
            spec:
              maxUnavailable: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
            {{- end }}
            {{- if $spec.expose }}
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $name }}
              annotations:
                {{ setResourceNameAnnotation "route" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/name: {{ $name }}
                platform.fernhill.io/owner: {{ $team }}
            spec:
              parentRefs:
                - name: platform
                  namespace: gateway
              hostnames:
                - {{ $host }}
              rules:
                - backendRefs:
                    - name: {{ $name }}
                      port: 80
            {{- end }}
            ---
            apiVersion: platform.fernhill.io/v1alpha1
            kind: WebService
            status:
              {{- if $spec.expose }}
              url: {{ $env.scheme }}://{{ $host }}{{ $env.urlPort }}
              {{- end }}
              {{- with $spec.database }}
              databaseSecret: {{ . }}-app
              {{- end }}
