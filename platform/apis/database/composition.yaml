# Composes a Fernhill Database into a CloudNativePG Cluster (ADR-0006, ADR-0014).
# Tested by rendering real XRs through this file: platform/apis/tests/.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: database-cnpg
spec:
  compositeTypeRef:
    apiVersion: platform.fernhill.io/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $team := $xr.metadata.namespace }}
            {{- $spec := $xr.spec | default dict }}

            {{- /*
              What each t-shirt size means. This table is the platform team's
              contract with tenants: changing it changes every database of
              that size on the next reconcile.
            */}}
            {{- $sizes := dict
                  "small"  (dict "instances" 1 "storage" "1Gi"  "cpu" "100m" "memory" "256Mi" "memoryLimit" "512Mi")
                  "medium" (dict "instances" 2 "storage" "10Gi" "cpu" "250m" "memory" "1Gi"   "memoryLimit" "1Gi")
                  "large"  (dict "instances" 3 "storage" "50Gi" "cpu" "1"    "memory" "4Gi"   "memoryLimit" "4Gi") }}

            {{- /* Patch versions are pinned so a minor upgrade is a reviewed PR. */}}
            {{- $images := dict
                  "16" "ghcr.io/cloudnative-pg/postgresql:16.15"
                  "17" "ghcr.io/cloudnative-pg/postgresql:17.11"
                  "18" "ghcr.io/cloudnative-pg/postgresql:18.6" }}

            {{- $size := index $sizes ($spec.size | default "small") }}
            {{- $database := $spec.databaseName | default "app" }}
            {{- $observed := .observed.resources | default dict }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              annotations:
                {{ setResourceNameAnnotation "cluster" }}
                {{- if eq (getResourceCondition "Ready" (index $observed "cluster")).Status "True" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                app.kubernetes.io/name: {{ $name }}
                app.kubernetes.io/component: database
                # Team namespaces are named after the team (ADR-0007).
                platform.fernhill.io/owner: {{ $team }}
            spec:
              instances: {{ $size.instances }}
              imageName: {{ index $images ($spec.version | default "18") }}
              storage:
                size: {{ $size.storage }}
              resources:
                requests:
                  cpu: {{ $size.cpu | quote }}
                  memory: {{ $size.memory }}
                limits:
                  memory: {{ $size.memoryLimit }}
              bootstrap:
                initdb:
                  database: {{ $database }}
                  owner: {{ $database }}
            ---
            # CloudNativePG writes connection details to "<cluster>-app"; this
            # is the contract the WebService API binds to.
            apiVersion: platform.fernhill.io/v1alpha1
            kind: Database
            status:
              connectionSecret: {{ $name }}-app
              host: {{ $name }}-rw.{{ $team }}.svc
              port: 5432
