# The Database API: a Postgres database, as a team asks for it.
#
# Teams choose only the database's name. Where it runs, how big it is, the
# Postgres version and the backup policy are the platform's decisions, made
# per environment (ADR-0019): CloudNativePG locally, Azure Database for
# PostgreSQL on AKS. Either way the team gets the same connection Secret.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.platform.fernhill.io
  annotations:
    # An API is never removed as a side effect of a sync or of deleting the
    # Argo CD app: Crossplane stops reconciling XRs once their XRD goes, which
    # strands every instance (and, for Database, its data). Removal is a
    # deliberate step once no instances remain. See ADR-0010.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  scope: Namespaced
  group: platform.fernhill.io
  names:
    kind: Database
    plural: databases
    categories: [fernhill]
  defaultCompositionRef:
    name: database
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.databaseName
        - name: Backend
          type: string
          jsonPath: .status.backend
        - name: Secret
          type: string
          jsonPath: .status.connectionSecret
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                databaseName:
                  type: string
                  description: Name of the database created inside the server.
                  pattern: "^[a-z][a-z0-9_]{0,62}$"
                  default: app
            status:
              type: object
              properties:
                connectionSecret:
                  type: string
                  description: >-
                    Secret in the same namespace with keys host, port, dbname,
                    user, password, and uri. Same keys on every backend.
                host:
                  type: string
                port:
                  type: integer
                backend:
                  type: string
                  description: Where the database runs (cloudnative-pg or azure-flexible-server).
