# An AKS-shaped environment (the shape terraform/aks outputs as
# platform_environment). CI renders the charts with it so TLS/LoadBalancer
# templates are exercised without a real cluster (ADR-0017).
environment:
  name: prod
  baseDomain: platform.fernhill.example
  urlPort: ""
  gateway:
    serviceType: LoadBalancer
    ipv4: 203.0.113.10
    resourceGroup: rg-fernhill-prod
  tls:
    enabled: true
    acmeEmail: platform-team@fernhill.example
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    azureDNS:
      subscriptionID: 00000000-0000-0000-0000-000000000001
      resourceGroup: rg-fernhill-prod
      zone: platform.fernhill.example
      clientID: 00000000-0000-0000-0000-000000000002
  sso:
    enabled: true
    tenantID: 00000000-0000-0000-0000-00000000000a
    argocdClientID: 00000000-0000-0000-0000-00000000000b
    portalClientID: 00000000-0000-0000-0000-00000000000c
    adminsGroupID: 00000000-0000-0000-0000-00000000000d
    engineersGroupID: 00000000-0000-0000-0000-00000000000e
  database:
    backend: azure-flexible-server
    azure:
      resourceGroup: rg-fernhill-prod-data
      location: eastus2
      version: "17"
      skuName: B_Standard_B1ms
      storageMb: 32768
      backupRetentionDays: 7
      delegatedSubnetID: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg-fernhill-prod/providers/Microsoft.Network/virtualNetworks/vnet-fernhill-prod/subnets/snet-postgres
      privateDNSZoneID: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg-fernhill-prod/providers/Microsoft.Network/privateDnsZones/fernhill-prod.private.postgres.database.azure.com
      clientID: 00000000-0000-0000-0000-00000000000f
      tenantID: 00000000-0000-0000-0000-00000000000a
      subscriptionID: 00000000-0000-0000-0000-000000000001
