name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        run: |
          for dir in terraform/argocd terraform/aks; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # Offline plan with mocked providers: no Azure credentials in CI (ADR-0016).
      - name: Terraform test (AKS)
        run: terraform -chdir=terraform/aks test

      - name: yamllint
        run: pipx run yamllint -s .

      - name: Lint charts
        run: |
          helm lint platform/apps platform/gateway platform/backstage

      - name: actionlint
        uses: raven-actions/actionlint@v2

  policy:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CI must evaluate policies with the same Kyverno version the cluster
      # runs, or the two can disagree (ADR-0005). Derive it from the pinned chart.
      - name: Install Kyverno CLI (version matched to cluster)
        run: scripts/install-kyverno-cli.sh

      - name: kyverno test
        run: kyverno test platform/policies/tests --detailed-results

      # The platform's own charts, rendered for local AND AKS (TLS, SSO), with
      # their workloads held to the same policies as tenants.
      - name: Platform charts per environment
        run: |
          pip install pyyaml==6.0.3
          scripts/check-charts.py

  apis:
    name: Platform API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Catalog API entities match their XRDs
        run: scripts/gen-catalog.py --check

      # Renders XRs through the real go-templating Compositions (ADR-0014).
      - name: Composition tests
        run: |
          pip install -r platform/apis/requirements-dev.txt
          scripts/install-crossplane-cli.sh
          pytest -q platform/apis

  # Tenant config is rendered through the real compositions and checked
  # against the real policies, so reviewers (of human or agent PRs) only
  # need to judge intent.
  tenants:
    name: Tenant config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install CLIs
        run: |
          pip install pyyaml==6.0.3 jinja2==3.1.6 -e agents/platform-mcp
          scripts/install-crossplane-cli.sh
          scripts/install-kyverno-cli.sh

      - name: Render tenants and evaluate policies
        run: scripts/check-tenants.py

      # Golden paths must generate PRs that pass this same gate.
      - name: Render golden-path templates through the gate
        run: scripts/test-templates.py

      # Agents get the same gate, and a rogue agent that skips the MCP
      # server's own checks is still stopped here (ADR-0013).
      - name: Run agent proposals through the gate
        run: scripts/test-agent-proposals.py

  agent-mcp:
    name: Platform MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install -e 'agents/platform-mcp[test]'
          pytest -q agents/platform-mcp

  # Extra rules for PRs opened by agents; human PRs pass straight through.
  agent-guardrails:
    name: Agent guardrails
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check agent PR rules
        env:
          AGENT_AUTHORS: aidp-agent[bot]
        run: |
          pip install pyyaml==6.0.3
          scripts/check-agent-pr.py

  portal:
    name: Portal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image tag matches portal/ content
        id: tag
        run: |
          scripts/portal-image.sh check
          echo "tag=$(scripts/portal-image.sh tag)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: portal
          tags: ghcr.io/nicpucacco/aidp-backstage:${{ steps.tag.outputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/portal.tar
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: portal-image
          path: ${{ runner.temp }}/portal.tar
          retention-days: 1

  # The same path a reviewer takes: fresh cluster -> terraform -> Argo CD
  # converges from Git. If this passes, `make up` works (ADR-0004).
  e2e:
    name: Bootstrap on kind
    runs-on: ubuntu-latest
    needs: [static, policy, apis, tenants, portal]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: helm/kind-action@v1
        with:
          cluster_name: aidp
          config: bootstrap/kind/cluster.yaml

      # The PR's portal image isn't published until merge, so load the one
      # built above. Same tag the chart pins, so no override is needed.
      - uses: actions/download-artifact@v8
        with:
          name: portal-image
          path: ${{ runner.temp }}

      - name: Load portal image into kind
        run: kind load image-archive "$RUNNER_TEMP/portal.tar" --name aidp

      - name: Bootstrap platform
        env:
          # Argo CD must fetch a commit that exists on GitHub. For PRs that's
          # the head commit, not the synthetic merge commit.
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
        run: |
          terraform -chdir=terraform/argocd init -input=false
          terraform -chdir=terraform/argocd apply -input=false -auto-approve \
            -var kube_context=kind-aidp \
            -var repo_url="$REPO_URL" \
            -var target_revision="$REVISION"

      - name: Wait for platform to converge
        run: scripts/wait-for-platform.sh

      - name: Admission smoke test
        run: scripts/e2e-admission.sh

      - name: Database golden path
        run: scripts/e2e-database.sh

      - name: WebService golden path
        run: scripts/e2e-webservice.sh

      - name: Portal serves the catalog
        run: scripts/e2e-portal.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          for app in $(kubectl -n argocd get applications -o name); do
            kubectl -n argocd get "$app" -o jsonpath='{.metadata.name}: {.status.sync.status}/{.status.health.status} {.status.conditions}{"\n"}' || true
          done
          kubectl get pods -A || true
          kubectl get databases.platform.fernhill.io,webservices.platform.fernhill.io,clusters.postgresql.cnpg.io -A -o wide || true
          kubectl get functions.pkg.crossplane.io,compositions,xrd || true
          kubectl -n backstage logs deploy/backstage -c backstage --tail=2000 \
            | grep -v -E 'incomingRequest|baseUrl is set to a localhost' | tail -80 || true
          kubectl -n backstage logs deploy/backstage -c git-sync --tail=20 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true

  # Merges to main publish the portal image under its content hash, so every
  # tag and commit on main can pull exactly the portal it describes.
  publish-portal:
    name: Publish portal image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "tag=$(scripts/portal-image.sh tag)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: portal
          push: true
          tags: ghcr.io/nicpucacco/aidp-backstage:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=portal
