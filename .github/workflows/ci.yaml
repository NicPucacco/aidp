name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform -chdir=bootstrap/terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=bootstrap/terraform init -backend=false -input=false
          terraform -chdir=bootstrap/terraform validate

      - name: yamllint
        run: pipx run yamllint -s .

      - name: Render app-of-apps
        run: |
          helm lint platform/apps
          helm template platform/apps > /dev/null

      - name: actionlint
        uses: raven-actions/actionlint@v2

  policy:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CI must evaluate policies with the same Kyverno version the cluster
      # runs, or the two can disagree (ADR-0005). Derive it from the pinned chart.
      - name: Install Kyverno CLI (version matched to cluster)
        run: scripts/install-kyverno-cli.sh

      - name: kyverno test
        run: kyverno test platform/policies/tests --detailed-results

  apis:
    name: Platform API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # function-python runs on Debian 13's Python 3.13.
          python-version: "3.13"

      - name: Compositions match their compose.py
        run: scripts/gen-compositions.py --check

      - name: Unit tests
        run: |
          pip install -r platform/apis/requirements-dev.txt
          pytest -q platform/apis

  # Tenant config is rendered through the real compositions and checked
  # against the real policies, so reviewers (of human or agent PRs) only
  # need to judge intent.
  tenants:
    name: Tenant config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install CLIs
        run: |
          pip install pyyaml==6.0.3
          scripts/install-crossplane-cli.sh
          scripts/install-kyverno-cli.sh

      - name: Render tenants and evaluate policies
        run: scripts/check-tenants.py

  # The same path a reviewer takes: fresh cluster -> terraform -> Argo CD
  # converges from Git. If this passes, `make up` works (ADR-0004).
  e2e:
    name: Bootstrap on kind
    runs-on: ubuntu-latest
    needs: [static, policy, apis, tenants]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: helm/kind-action@v1
        with:
          cluster_name: aidp
          config: bootstrap/kind/cluster.yaml

      - name: Bootstrap platform
        env:
          # Argo CD must fetch a commit that exists on GitHub. For PRs that's
          # the head commit, not the synthetic merge commit.
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
        run: |
          terraform -chdir=bootstrap/terraform init -input=false
          terraform -chdir=bootstrap/terraform apply -input=false -auto-approve \
            -var kube_context=kind-aidp \
            -var repo_url="$REPO_URL" \
            -var target_revision="$REVISION"

      - name: Wait for platform to converge
        run: scripts/wait-for-platform.sh

      - name: Admission smoke test
        run: scripts/e2e-admission.sh

      - name: Database golden path
        run: scripts/e2e-database.sh

      - name: WebService golden path
        run: scripts/e2e-webservice.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          for app in $(kubectl -n argocd get applications -o name); do
            kubectl -n argocd get "$app" -o jsonpath='{.metadata.name}: {.status.sync.status}/{.status.health.status} {.status.conditions}{"\n"}' || true
          done
          kubectl get pods -A || true
          kubectl get databases.platform.fernhill.io,webservices.platform.fernhill.io,clusters.postgresql.cnpg.io -A -o wide || true
          kubectl get functions.pkg.crossplane.io,compositions,xrd || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
