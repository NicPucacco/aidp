[project]
name = "fernhill-platform-mcp"
version = "0.1.0"
description = "The Fernhill platform as MCP tools: discover golden paths, propose changes as pull requests."
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "respx==0.23.1"]

[project.scripts]
fernhill-platform-mcp = "fernhill_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fernhill_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
