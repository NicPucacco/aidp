extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent

ignore: |
  .terraform/
  platform/apps/templates/
  platform/backstage/templates/
  golden-paths/*/skeleton*/
  node_modules/
  # Generated by @backstage/create-app; upstream's comment style.
  portal/app-config.yaml
  portal/node_modules/
